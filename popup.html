<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="css/popup.css">

  <title>ZeroUi</title>
</head>

<body>
  <div id="container">

    <div id="content">
      <div id="header">
        <div id="logo">
          <img src="images/icon-32.png" alt="ZeroUi">
          <div>ZeroUi</div>
        </div>
      
      <div id="icons">
        <span>
          <input type="checkbox" id="zeroui_on" class="yt-setting">
          <label for="zeroui_on" class="yt-setting">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18">
              <title>Turn on or off</title>
              <path d="M9,18c-4.3,0-7.9-3.5-7.9-7.9c0-1.9,0.7-3.8,2-5.3c0.5-0.6,1.3-0.6,1.9-0.1c0.6,0.5,0.6,1.3,0.1,1.9
      							c-0.9,1-1.3,2.2-1.3,3.5c0,2.9,2.3,5.2,5.2,5.2s5.2-2.3,5.2-5.2c0-1.3-0.5-2.5-1.3-3.5c-0.5-0.6-0.5-1.4,0.1-1.9s1.4-0.5,1.9,0.1
      							c1.3,1.5,2,3.3,2,5.3C16.9,14.5,13.3,18,9,18z M9,11.5c-0.7,0-1.3-0.6-1.3-1.3V1.3C7.7,0.6,8.3,0,9,0s1.3,0.6,1.3,1.3v8.8
      							C10.4,10.9,9.8,11.5,9,11.5z"></path>
            </svg>
          </label>
        </span>
      </div>
      </div>
      <hr>
    </div>
    <div id="off">
      <svg xmlns="http://www.w3.org/2000/svg" width="4em" height="4em" viewBox="0 0 18 18">
        <path d="M9,18c-4.3,0-7.9-3.5-7.9-7.9c0-1.9,0.7-3.8,2-5.3c0.5-0.6,1.3-0.6,1.9-0.1c0.6,0.5,0.6,1.3,0.1,1.9
            c-0.9,1-1.3,2.2-1.3,3.5c0,2.9,2.3,5.2,5.2,5.2s5.2-2.3,5.2-5.2c0-1.3-0.5-2.5-1.3-3.5c-0.5-0.6-0.5-1.4,0.1-1.9s1.4-0.5,1.9,0.1
            c1.3,1.5,2,3.3,2,5.3C16.9,14.5,13.3,18,9,18z M9,11.5c-0.7,0-1.3-0.6-1.3-1.3V1.3C7.7,0.6,8.3,0,9,0s1.3,0.6,1.3,1.3v8.8
            C10.4,10.9,9.8,11.5,9,11.5z" />
      </svg>
      <p>ZeroUI is off.</p>
    </div>
    <main id="options">
      <ul>
        <li>
          <input type="checkbox" id="hide_emojis" class="check">
          <label for="hide_emojis">Hide Emojis</label>
        </li>

        <li>
          <input type="checkbox" id="hide_icons" class="check">
          <label for="hide_icons">Hide Icons</label>
        </li>
        
        <li>
          <input type="checkbox" id="hide_favicon" class="check">
          <label for="hide_favicon">Hide Favicon</label>
        </li>

        <li>
          <input type="checkbox" id="hide_buttons" class="check">
          <label for="hide_buttons">Hide Buttons</label>
        </li>

        <li>
          <input type="checkbox" id="hide_menus" class="check">
          <label for="hide_menus">Hide Menus</label>
        </li>

        <li>
          <input type="checkbox" id="hide_images" class="check">
          <label for="hide_images">Hide Images</label>
        </li>
        
        <li>
          <input type="checkbox" id="hide_backgrounds" class="check">
          <label for="hide_backgrounds">Hide Background Images</label>
        </li>
      </ul>
    </main>

    <hr id="footer-hr">

    <footer id="footer">
      <a href="donate.html" id="donate">Donate</a>
      <a href="https://docs.google.com/forms/d/e/1FAIpQLScxdBs_Gn7-iBOvgQjIGmylWLznvoWDy-iUlfQ3s_2yoO9BHw/viewform" id="request-feature" target="_blank">
        Request Feature
      </a>
      <a href="support.html" id="support">Support</a>
    </footer>

  </div>

  <script src="js/popup.js"></script>
</body>
</html>
